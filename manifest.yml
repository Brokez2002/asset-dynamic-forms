modules:
  jira:uiModifications:
    - key: asset-dynamic-forms-hello-world-ui-modifications
      title: asset-dynamic-forms
      resource: uiModificationsMain
      resolver:
        function: resolver
      unlicensedAccess:
        - customer
  jira:adminPage:
    - key: asset-dynamic-forms-admin
      title: Asset Dynamic Forms
      resource: adminPage
      resolver:
        function: resolver
      render: native
  trigger:
    - key: asset-dynamic-forms-hello-world-ui-modifications-install
      function: main
      events:
        - avi:forge:installed:app
    - key: asset-writeback-on-create
      function: writeback-create
      events:
        - avi:jira:created:issue
    - key: asset-writeback-on-update
      function: writeback-update
      events:
        - avi:jira:updated:issue
      filter:
        ignoreSelf: true
  scheduledTrigger:
    - key: asset-option-sync-schedule
      function: sync
      interval: fiveMinute
  webtrigger:
    - key: asset-option-sync-now
      function: sync-web
  function:
    - key: main
      handler: index.run
    - key: resolver
      handler: index.handler
    - key: sync
      handler: sync.runSync
    - key: sync-web
      handler: sync.runSyncWeb
    - key: writeback-create
      handler: writeback.onCreate
    - key: writeback-update
      handler: writeback.onUpdate
resources:
  - key: uiModificationsMain
    path: static/hello-world/build
  - key: adminPage
    path: src/frontend/admin.jsx
permissions:
  scopes:
    - storage:app
    - manage:jira-configuration
    - read:jira-user
    - read:jira-work
    - write:jira-work
    - read:servicedesk-request
    - read:cmdb-object:jira
    - write:cmdb-object:jira
    - read:cmdb-type:jira
    - read:cmdb-attribute:jira
    - read:cmdb-schema:jira
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/c0d257fd-69df-4a2f-9bc3-49fd90d88538